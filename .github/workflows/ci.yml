name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build
        run: ./scripts/build.sh

      - name: Run test suite (19 assertions)
        run: java -cp build/classes RunAllTests

      - name: Run end-to-end demo
        run: java -cp build/classes Main

      - name: Generate benchmark dataset
        run: |
          mkdir -p data
          python3 -c "
          import random
          random.seed(42)
          cats = ['Physics','Chemistry','Medicine','Literature','Peace','Economics']
          countries = ['USA','UK','France','Germany','Japan','India','Canada','Kenya','Brazil','Israel']
          genders = ['Male','Female']
          with open('data/bench_10k.csv','w') as f:
              for i in range(10000):
                  year = 1901 + (i % 124)
                  f.write(f'{year},{random.choice(cats)},Winner{i},{random.choice(countries)},{random.choice(genders)}\n')
          "

      - name: Run scale benchmark
        run: java -cp build/classes ScaleBenchmark
